# Дополняет дефолтный конфиг detekt (buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
    functionThreshold: 8
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignorePrivate: true

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Preview']
    # theme — токены, illustration — координаты SVG-рисунков из макета (питомец, уголок).
    excludes: ['**/test/**', '**/testDebug/**', '**/androidTest/**', '**/theme/**', '**/illustration/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview', 'PreviewLightDark']
  WildcardImport:
    active: true
  ForbiddenComment:
    # TODO разрешены: каркас намеренно оставляет места для доработки. FIXME/STOPSHIP — нет.
    comments: ['FIXME:', 'STOPSHIP:']
