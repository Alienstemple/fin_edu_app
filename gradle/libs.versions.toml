[versions]
agp = "9.1.0"
kotlin = "2.4.20"
ksp = "2.3.12"
hilt = "2.60.1"
androidx-hilt = "1.3.0"
compose-bom = "2026.06.01"
activity-compose = "1.13.0"
core-ktx = "1.18.0"
lifecycle = "2.10.0"
navigation = "2.9.8"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
detekt = "1.23.8"
spotless = "8.10.3"
ktlint = "1.8.0"
kover = "0.9.9"
junit = "4.13.2"
mockk = "1.14.11"
turbine = "1.2.1"
robolectric = "4.17"
androidx-test-ext = "1.3.0"
espresso = "3.7.0"

android-compileSdk = "36"
android-targetSdk = "36"
android-minSdk = "26"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidx-hilt" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

test-junit = { module = "junit:junit", version.ref = "junit" }
test-mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
test-kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
test-turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
test-robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
test-androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

# Gradle-плагины для build-logic
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
kover-gradlePlugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

# Convention-плагины из build-logic
convention-root-project = { id = "convention.root-project" }
convention-android-application = { id = "convention.android-application" }
convention-android-feature-api = { id = "convention.android-feature-api" }
convention-android-feature-ui = { id = "convention.android-feature-ui" }
convention-android-feature-data = { id = "convention.android-feature-data" }
convention-kotlin-feature-domain = { id = "convention.kotlin-feature-domain" }
convention-android-library-compose = { id = "convention.android-library-compose" }
convention-kotlin-jvm = { id = "convention.kotlin-jvm" }
convention-hilt = { id = "convention.hilt" }
